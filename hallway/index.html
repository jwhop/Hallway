<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./main.css">
    <title>Pavement</title>
</head>

<body>
    <img src="./src/monitor.png" class="monitorImage">
    <div class="outsideWrapper" id="outerContainer">
        <div class="windowHeader">
            <button> + </button>
        </div>
        <div class="insideWrapper" id="innerContainer">
        </div>
    </div>
    <div class="buttonMenu" id="buttonMenu" style="left:1000px">
        <div class="draggable" id="buttonMenuheader">Image Window</div>
        <button id="addGuy">Add Guy</button>
        <button id="export">Export</button>
        <button id="addPlane">Add Plane</button>
        <button id="addCube">Add Cube</button>
        <button id="addSphere">Add Sphere</button>
    </div>
    <div class="objectPropertiesMenu" id="objectPropertiesMenu" style="left:1200px">
        <div class="draggable" id="objectPropertiesMenuheader">Object Settings</div>
        <button id="toggleWireframe"> Toggle Wireframe/Shaded </button>
        <button id="snapToGround"> Snap to Ground </button>
        <button id="removeObject"> removeObject </button>
        <button id="readyWalkableGeometry"> ready walkable geometry </button>
    </div>
    <div class="imagesMenu" id="imagesMenu" style="left:1600px">
        <div class="draggable" id="imagesMenuheader">Images</div>

    </div>
    <script type="module" src="/src/main.ts"></script>

</body>
</html>
